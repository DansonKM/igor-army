<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИГОРЬ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }

        /* === ФОН === */
        .bg-kremlin {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('background.jpg') center/cover no-repeat;
            z-index: 0;
            filter: brightness(0.75) contrast(1.1) saturate(0.7);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
        }

        /* === ВИНЬЕТКА === */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* === СНЕГ === */
        #snow-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* === ИНТРО === */
        #intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 2s ease;
        }

        #intro.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .intro-text {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .intro-text.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .intro-text.red {
            color: #8b0000;
            text-shadow: 0 0 30px rgba(139, 0, 0, 0.4);
        }

        .intro-separator {
            width: 0;
            height: 2px;
            background: #444;
            margin: 50px 0;
            transition: width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .intro-separator.visible {
            width: 300px;
        }

        .intro-enter {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: #444;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin-top: 80px;
            padding: 20px 60px;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            background: transparent;
            position: relative;
            overflow: hidden;
        }

        .intro-enter.visible {
            opacity: 1;
        }

        .intro-enter::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(139, 0, 0, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .intro-enter:hover::before {
            left: 100%;
        }

        .intro-enter:hover {
            color: #fff;
            border-color: #8b0000;
            background: rgba(139, 0, 0, 0.05);
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        /* === ОСНОВНОЙ КОНТЕНТ === */
        #main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #main-content.visible {
            opacity: 1;
        }

        .counter-block {
            text-align: center;
        }

        .label-top {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin-bottom: 50px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .label-top.civilian {
            color: #777;
        }

        .days-number {
            font-size: clamp(5rem, 18vw, 12rem);
            color: #fff;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.25), 0 4px 30px rgba(0,0,0,0.9);
        }

        .days-label {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #8b0000;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.6em;
            margin-top: 25px;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .time-breakdown {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-top: 40px;
        }

        .time-unit {
            text-align: center;
        }

        .time-value {
            font-size: clamp(1.5rem, 4vw, 3rem);
            color: #fff;
            font-weight: 900;
            text-shadow: 0 2px 15px rgba(0,0,0,0.9);
        }

        .time-label {
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            color: #8b0000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            margin-top: 8px;
        }

        .date-info {
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            color: #555;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-top: 60px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* === СЧЁТЧИК ПОСЕЩЕНИЙ === */
        .visit-counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #1a1a1a;
            padding: 8px 16px;
            color: #444;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-family: Arial, sans-serif;
        }

        .visit-counter span {
            color: #8b0000;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <!-- Фон -->
    <div class="bg-kremlin"></div>
    <div class="bg-overlay"></div>
    <div class="vignette"></div>

    <!-- Снег -->
    <canvas id="snow-canvas"></canvas>

    <!-- Интро -->
    <div id="intro">
        <div class="intro-text" id="intro-line1">СКОЛЬКО ДНЕЙ</div>
        <div class="intro-separator" id="intro-sep"></div>
        <div class="intro-text red" id="intro-line2">ИГОРЬ ТАМ</div>
        <div class="intro-enter" id="intro-enter" onclick="enterSite()">ДАЛЕЕ</div>
    </div>

    <!-- Основной контент -->
    <div id="main-content">
        <div class="counter-block">
            <div class="label-top" id="label-top">ИГОРЬ НА СЛУЖБЕ</div>
            <div class="days-number" id="days-count">0</div>
            <div class="days-label" id="days-label">ДНЕЙ</div>
            <div class="time-breakdown" id="time-breakdown">
                <div class="time-unit">
                    <div class="time-value" id="hours">00</div>
                    <div class="time-label">ЧАСОВ</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="minutes">00</div>
                    <div class="time-label">МИНУТ</div>
                </div>
                <div class="time-unit">
                    <div class="time-value" id="seconds">00</div>
                    <div class="time-label">СЕКУНД</div>
                </div>
            </div>
            <div class="date-info" id="date-info">ДАТА ПРИЗЫВА НЕ УКАЗАНА</div>
        </div>
    </div>

    <!-- Счётчик посещений -->
    <div class="visit-counter">
        Посещений: <span id="visit-count">0</span>
    </div>

    <!-- Аудио -->
    <audio id="music" loop>
        <source src="Хор Иоанна Дамаскина - Конец Былины.mp3" type="audio/mpeg">
    </audio>
    <audio id="ambient" loop>
        <source src="snowstorm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ============================================
        // НАСТРОЙКИ
        // ============================================
        const CONFIG = {
            startDate: '2025-01-01', // ← ДАТА ПРИЗЫВА (ГГГГ-ММ-ДД)
        };
        // ============================================

        // === ИНТРО — ЖЁСТКАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ ===
        function playIntro() {
            const line1 = document.getElementById('intro-line1');
            const sep = document.getElementById('intro-sep');
            const line2 = document.getElementById('intro-line2');
            const enter = document.getElementById('intro-enter');

            // Шаг 1: Первая строка
            setTimeout(() => line1.classList.add('visible'), 300);

            // Шаг 2: Линия
            setTimeout(() => sep.classList.add('visible'), 1500);

            // Шаг 3: Вторая строка
            setTimeout(() => line2.classList.add('visible'), 2500);

            // Шаг 4: Кнопка
            setTimeout(() => enter.classList.add('visible'), 3500);
        }

        function enterSite() {
            const intro = document.getElementById('intro');
            const main = document.getElementById('main-content');

            intro.classList.add('hidden');
            main.classList.add('visible');
            startAudio();
        }

        // === АУДИО ===
        function startAudio() {
            const music = document.getElementById('music');
            const ambient = document.getElementById('ambient');
            music.volume = 0.7;
            ambient.volume = 0.35;
            
            music.play().then(() => {
                ambient.play().catch(() => {});
            }).catch(() => {});
        }

        // === СНЕГ ===
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');
        let flakes = [];
        let wind = 0;
        let windTarget = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Flake {
            constructor(init) {
                this.init(init);
            }

            init(init) {
                this.x = Math.random() * (canvas.width + 400) - 200;
                this.y = init ? Math.random() * canvas.height : -20 - Math.random() * 100;
                this.z = Math.random() * 0.85 + 0.15;
                this.radius = this.z * 2.8 + 0.4;
                this.speed = this.z * 2.0 + 0.2;
                this.opacity = this.z * 0.75 + 0.15;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.025 + 0.008;
                this.wobbleAmount = Math.random() * 2.0 + 0.4;
            }

            update() {
                this.wobble += this.wobbleSpeed;
                this.y += this.speed;
                this.x += Math.sin(this.wobble) * this.wobbleAmount + wind * this.z * 1.5;

                if (this.x > canvas.width + 100) this.x = -100;
                if (this.x < -100) this.x = canvas.width + 100;

                if (this.y > canvas.height + 20) {
                    this.init(false);
                }
            }

            draw() {
                if (this.z > 0.6) {
                    const grad = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, this.radius * 3
                    );
                    grad.addColorStop(0, `rgba(255, 255, 255, ${this.opacity * 0.12})`);
                    grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(
                        this.x - this.radius * 3,
                        this.y - this.radius * 3,
                        this.radius * 6,
                        this.radius * 6
                    );
                }

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initSnow() {
            resize();
            flakes = [];
            const count = Math.floor((canvas.width * canvas.height) / 2500);
            for (let i = 0; i < count; i++) {
                flakes.push(new Flake(true));
            }
        }

        function animSnow() {
            if (Math.random() < 0.003) {
                windTarget = (Math.random() - 0.5) * 3;
            }
            wind += (windTarget - wind) * 0.008;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            flakes.sort((a, b) => a.z - b.z);
            flakes.forEach(f => {
                f.update();
                f.draw();
            });

            requestAnimationFrame(animSnow);
        }

        // === СКЛОНЕНИЕ ===
        function pluralDays(n) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return 'ДЕНЬ';
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return 'ДНЯ';
            return 'ДНЕЙ';
        }

        // === СЧЁТЧИК ===
        function update() {
            const labelTop = document.getElementById('label-top');
            const daysEl = document.getElementById('days-count');
            const daysLabel = document.getElementById('days-label');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const dateInfo = document.getElementById('date-info');

            if (CONFIG.startDate && CONFIG.startDate !== '2025-01-01') {
                const start = new Date(CONFIG.startDate);
                const now = new Date();
                const diff = now - start;

                if (diff < 0) {
                    labelTop.textContent = 'ИГОРЬ ЕЩЁ НА ГРАЖДАНКЕ';
                    labelTop.classList.add('civilian');
                    daysEl.textContent = '0';
                    daysLabel.textContent = pluralDays(0);
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    dateInfo.textContent = 'ДАТА ПРИЗЫВА: ' + fmt(start);
                } else {
                    labelTop.textContent = 'ИГОРЬ НА СЛУЖБЕ';
                    labelTop.classList.remove('civilian');

                    const days = Math.floor(diff / 86400000);
                    const hours = Math.floor((diff % 86400000) / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);

                    daysEl.textContent = days;
                    daysLabel.textContent = pluralDays(days);
                    hoursEl.textContent = String(hours).padStart(2, '0');
                    minutesEl.textContent = String(minutes).padStart(2, '0');
                    secondsEl.textContent = String(seconds).padStart(2, '0');
                    dateInfo.textContent = 'ДАТА ПРИЗЫВА: ' + fmt(start);
                }
            } else {
                labelTop.textContent = 'ИГОРЬ ЕЩЁ НА ГРАЖДАНКЕ';
                labelTop.classList.add('civilian');
                daysEl.textContent = '0';
                daysLabel.textContent = 'ДНЕЙ';
                hoursEl.textContent = '00';
                minutesEl.textContent = '00';
                secondsEl.textContent = '00';
                dateInfo.textContent = 'ДАТА ПРИЗЫВА НЕ УКАЗАНА';
            }
        }

        function fmt(d) {
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // === СЧЁТЧИК ПОСЕЩЕНИЙ (СБРОШЕН) ===
        function updateVisitCounter() {
            const namespace = 'igor_army_counter_v3';
            const key = 'visits';

            fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('visit-count').textContent = data.value;
                })
                .catch(() => {
                    let count = parseInt(localStorage.getItem('visit_count_v3') || '0') + 1;
                    localStorage.setItem('visit_count_v3', count.toString());
                    document.getElementById('visit-count').textContent = count;
                });
        }

        // === ИНИЦИАЛИЗАЦИЯ ===
        window.addEventListener('resize', resize);
        window.addEventListener('load', () => {
            initSnow();
            animSnow();
            update();
            updateVisitCounter();
            playIntro();
            setInterval(update, 1000);
        });
    </script>
</body>
</html>
